name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repository:
    name: Repository Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      # Only these authors may change files that run code on install, commit or
      # folder open.
      TRUSTED_AUTHORS: DeborahOlaboye
      PROTECTED: '^(\.github/|\.gitignore$|\.vscode/|\.husky/|\.devcontainer/|\.npmrc$|\.yarnrc|\.yarn/|\.pnpmfile\.cjs$|scripts/prepare\.mjs$)'
      LIFECYCLE: '"(preinstall|install|postinstall|preprepare|prepare|postprepare|prepublish|prepublishOnly|prepack|postpack)"[[:space:]]*:'
    steps:
      - uses: actions/checkout@v4
      - name: Check for editor tasks and disallowed paths
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.vscode/(tasks|launch)\.json$|(^|/)dist/setup\.js$|(^|/)fa-solid-(300|500|600)[^/]*$|(^|/)fa-solid\.[^/]+$|\.(lfk|lkf|llf)$' || true)
          if [ -n "$bad" ]; then
            echo "$bad" | while IFS= read -r f; do echo "::error file=$f::path not allowed in this repository"; done
            exit 1
          fi
      # Every font must start with its format's signature, so a script renamed
      # to a font extension cannot pass as an asset.
      - name: Check font files are real fonts
        run: |
          fail=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            ok=
            sig=$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')
            case "${f##*.}" in
              woff2|WOFF2) ok=$([ "$sig" = 774f4632 ] && echo y) ;;
              woff|WOFF)   ok=$([ "$sig" = 774f4646 ] && echo y) ;;
              ttf|TTF|otf|OTF) case "$sig" in 00010000|74727565|4f54544f) ok=y ;; esac ;;
              eot|EOT)     ok=$([ "$(head -c 36 "$f" | tail -c 2)" = LP ] && echo y) ;;
            esac
            if [ -z "$ok" ]; then echo "::error file=$f::not a valid font file"; fail=1; fi
          done < <(git ls-files | grep -iE '\.(woff2?|ttf|otf|eot)$')
          exit $fail
      # npm runs lifecycle scripts on install. Existing ones stay; a pull
      # request may not add or change one.
      - name: Check install hooks are unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --no-tags --depth=1 origin "$BASE_SHA"
          fail=0
          for f in $(git ls-files '*package.json'); do
            head_hooks=$(grep -E "$LIFECYCLE" "$f" | tr -s '[:space:]' ' ' | sort)
            base_hooks=$(git show "$BASE_SHA:$f" 2>/dev/null | grep -E "$LIFECYCLE" | tr -s '[:space:]' ' ' | sort)
            if [ "$head_hooks" != "$base_hooks" ]; then
              echo "::error file=$f::install hook added or changed"; fail=1
            fi
          done
          exit $fail
      - name: Check package scripts
        run: |
          bad=$(git ls-files '*package.json' | xargs -r grep -lE 'node +api\.js|dist/setup\.js|curl |wget |base64 -d' || true)
          if [ -n "$bad" ]; then
            echo "$bad" | while IFS= read -r f; do echo "::error file=$f::package script downloads or runs unexpected code"; done
            exit 1
          fi
      # Code appended after `export default`, behind a long run of blank space
      # or on one very long line, is easy to miss in review.
      - name: Check config files for appended code
        run: |
          fail=0
          for f in $(git ls-files | grep -E '(^|/)(postcss|tailwind|eslint|next|jest|vite|vitest|webpack|babel|prettier)\.config\.[cm]?[jt]s$|(^|/)\.eslintrc'); do
            if awk 'length > 500 { exit 1 }' "$f" && ! grep -qE '[[:space:]]{200,}' "$f"; then continue; fi
            echo "::error file=$f::very long line or large blank gap"; fail=1
          done
          exit $fail
      # .github/ is excluded because this file names the strings itself; the
      # protected-files step covers it instead.
      - name: Check for known malicious strings
        run: |
          bad=$(git grep -lF -e 'rmcej%otb%' -e 'Cot%3t=shtP' -e '_$_1e42' -e 'folderOpen' -e 'allowAutomaticTasks' -- ':!.github/' || true)
          if [ -n "$bad" ]; then
            echo "$bad" | while IFS= read -r f; do echo "::error file=$f::known malicious string or editor auto-run setting"; done
            exit 1
          fi
      - name: Check protected files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          case " $TRUSTED_AUTHORS " in *" $AUTHOR "*) exit 0;; esac
          bad=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' | grep -E "$PROTECTED" || true)
          if [ -n "$bad" ]; then
            echo "$bad" | while IFS= read -r f; do echo "::error file=$f::only a maintainer may change this file"; done
            exit 1
          fi

  vitals:
    name: Core Web Vitals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the PR base for the performance delta
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .vitals-base
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install PR base dependencies
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: npm ci --prefix .vitals-base
      - name: Measure the PR base with the same journeys
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/vitals-run.mjs --reference .vitals-base
      - run: npm run test:vitals
      - name: Upload per-route measurements and deltas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-web-vitals
          path: |
            test-results/vitals/
            vitals-reference.json
            vitals-reference-error.txt
          retention-days: 14

  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check translation, bundle inventory and worker regressions
        run: npm test -- lib/i18n/catalogue.test.ts scripts/bundle-contents.test.mjs scripts/service-worker.test.mjs
      - run: npm run build
      - run: git diff --exit-code -- lib/generated
      # Coverage rather than a plain run: the text summary lands in the job log
      # and the HTML/lcov report is uploaded below, so coverage cannot quietly
      # rot back toward zero without anyone noticing.
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  bundle:
    name: Bundle Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The report measures compiled client chunks, so this job builds in
      # compile mode: type checking belongs to the build job above, and
      # prerendering does not change which chunks a route loads.
      - run: npm run build:bundle
      - run: npm run bundle:contents
      - run: npm run bundle:report
      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: |
            .next/bundle-report.json
            .next/bundle-contents.json
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Playwright builds and starts the app itself — see playwright.config.ts.
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  e2e-live-backend:
    name: E2E (seeded backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Lumeeena/lumina-backend
          ref: main
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start seeded GraphQL backend
        run: docker compose -f backend/docker/docker-compose.yml up -d --build postgres graphql
      - name: Wait for GraphQL health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f backend/docker/docker-compose.yml logs graphql postgres
          exit 1
      - name: Run seeded-backend E2E tests
        env:
          E2E_GRAPHQL_URL: http://127.0.0.1:4000/graphql
        run: npx playwright test e2e/live-backend.spec.ts
      - name: Upload live Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-backend-report
          path: playwright-report/
          retention-days: 14
      - name: Stop seeded backend
        if: always()
        run: docker compose -f backend/docker/docker-compose.yml down -v
