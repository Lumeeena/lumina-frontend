# The list half of the asset browser (#52). Deliberately does not select
# `series`: that is the expensive part of AssetDetail and a list of twenty of
# them is an aggregation nobody asked for. The detail query has it.
query Assets($sortBy: AssetSort, $limit: Int, $cursor: String) {
  assets(sortBy: $sortBy, limit: $limit, cursor: $cursor) {
    items {
      asset
      code
      issuer
      native
      supply
      holders
    }
    pageInfo {
      hasNextPage
      cursor
    }
  }
}

# Per-asset transfer volume series used by the portfolio section of the account
# page. `bucketSeconds` defaults to 86400 (daily) server-side; omitting it
# here keeps the operation flexible for future range selectors.
query AssetVolume($asset: String!, $from: String, $to: String, $bucketSeconds: Int) {
  asset(asset: $asset, from: $from, to: $to, bucketSeconds: $bucketSeconds) {
    asset
    code
    native
    series {
      bucketStart
      volume
      operationCount
    }
  }
}

query AccountTrustlineOps($address: String!, $limit: Int, $cursor: String) {
  operations(account: $address, type: CHANGE_TRUST, limit: $limit, cursor: $cursor) {
    items {
      id
      type
      createdAt
      transactionHash
      sourceAccount
      asset
      amount
    }
    pageInfo {
      hasNextPage
      cursor
    }
  }
}
