query LatestLedger($network: Network) {
  latestLedger(network: $network) {
    sequence
    closedAt
    transactionCount
    operationCount
  }
}

query AccountDetail($address: String!, $network: Network) {
  account(address: $address, network: $network) {
    address
    sequence
    subentryCount
    lastModifiedLedger
    numSponsored
    numSponsoring
    balances {
      assetType
      assetCode
      assetIssuer
      balance
      limit
    }
    flags {
      authRequired
      authRevocable
      authImmutable
      authClawbackEnabled
    }
    transactions(limit: 10) {
      hash
      ledger
      createdAt
      sourceAccount
      feeCharged
      operationCount
      successful
      memoType
      memo
      feePayer
      innerTransaction {
        hash
        sourceAccount
        operationCount
        successful
      }
    }
    operations(limit: 10) {
      id
      type
      createdAt
      transactionHash
      sourceAccount
      from
      to
      amount
      asset
      startingBalance
      funder
      offerId
      price
      selling
      buying
    }
  }
}

query ContractEvents($contractId: String!, $limit: Int, $cursor: String, $network: Network) {
  events(contractId: $contractId, limit: $limit, cursor: $cursor, network: $network) {
    items {
      id
      type
      contractId
      ledger
      createdAt
      pagingToken
      topics
      value
    }
    pageInfo { hasNextPage cursor }
  }
}

query AccountAsOfLedger(
