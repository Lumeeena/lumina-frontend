      assetIssuer
      balance
      limit
    }
    flags {
      authRequired
      authRevocable
      authImmutable
      authClawbackEnabled
    }
  }
}

query Stats($opLimit: Int, $network: Network) {
  latestLedger(network: $network) {
    sequence
    transactionCount
    operationCount
  }
  operations(limit: $opLimit, network: $network) {
    items {
      type
      createdAt
      sourceAccount
    }
  }
  transactions(limit: $opLimit, network: $network) {
    items {
      createdAt
      sourceAccount
      operationCount
      successful
    }
  }
}

