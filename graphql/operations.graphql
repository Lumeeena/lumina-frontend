# The list half of the asset browser (#52). Deliberately does not select
# `series`: that is the expensive part of AssetDetail and a list of twenty of
# them is an aggregation nobody asked for. The detail query has it.
query Assets($sortBy: AssetSort, $limit: Int, $cursor: String, $network: Network) {
  assets(sortBy: $sortBy, limit: $limit, cursor: $cursor, network: $network) {
    items {
      asset
      code
      issuer
      native
      supply
      holders
    }
    pageInfo {
      hasNextPage
      cursor
    }
  }
}

# Per-asset transfer volume series used by the portfolio section of the account
# page. `bucketSeconds` defaults to 86400 (daily) server-side; omitting it
# here keeps the operation flexible for future range selectors.
query AssetVolume($asset: String!, $from: String, $to: String, $bucketSeconds: Int, $network: Network) {
  asset(asset: $asset, from: $from, to: $to, bucketSeconds: $bucketSeconds, network: $network) {
    asset
    code
    native
    series {
      bucketStart
      volume
      operationCount
    }
  }
}

