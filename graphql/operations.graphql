    }
    pageInfo {
      hasNextPage
      cursor
    }
  }
}

query LedgerDetail($sequence: Int!, $network: Network, $limit: Int, $cursor: String) {
  ledger(sequence: $sequence, network: $network) {
    sequence
    closedAt
    transactionCount
    operationCount
    baseFee
    baseReserve
  }
  transactions(limit: $limit, cursor: $cursor, network: $network) {
    items {
      hash
      ledger
      createdAt
      sourceAccount
      feeCharged
      operationCount
      successful
      memoType
      memo
    }
    pageInfo {
      hasNextPage
      cursor
    }
  }
}
